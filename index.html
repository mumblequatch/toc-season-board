<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOC Season Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: one column per season plus the B team, side by side; snapshots run underneath. */
:root {
  --paper: #f6f8fb;
  --card: #ffffff;
  --ink: #1d2430;
  --muted: #667085;
  --rule: #cfdcec;
  --accent: #c8433b;
  --accent-soft: #fbe9e7;
  --bteam: #eef2f7;
  --focus: #2f63b5;
  --display: "Courier Prime", "Courier New", Courier, monospace;
  --label: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161f; --card: #19212d; --ink: #e5e9f0; --muted: #94a0b3;
    --rule: #2c3a4f; --accent: #e3685f; --accent-soft: #3a2224; --bteam: #151c27; --focus: #7aa7ec;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161f; --card: #19212d; --ink: #e5e9f0; --muted: #94a0b3;
  --rule: #2c3a4f; --accent: #e3685f; --accent-soft: #3a2224; --bteam: #151c27; --focus: #7aa7ec;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--label); font-size: 15px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 60px; display: grid; gap: 18px; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; justify-content: space-between; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 1.7rem; letter-spacing: .01em; }
h1 small { display: block; font-family: var(--label); font-weight: 500; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, .btn { font-family: var(--label); font-weight: 600; font-size: .78rem; letter-spacing: .05em; text-transform: uppercase; padding: 8px 11px; border-radius: 4px; border: 1px solid var(--rule); background: var(--card); color: var(--ink); cursor: pointer; line-height: 1; }
button:hover:not(:disabled), .btn:hover { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .btn:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.quiet { border-color: transparent; background: transparent; padding: 6px 8px; }
button.danger { color: var(--accent); }
.sep { width: 1px; height: 22px; background: var(--rule); }
label.toggle { display: inline-flex; gap: 6px; align-items: center; font-size: .8rem; color: var(--muted); cursor: pointer; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 14px; overflow-x: auto; padding-bottom: 6px; align-items: start; }
@media (max-width: 720px) { .board { grid-auto-flow: row; grid-auto-columns: auto; overflow-x: visible; } }
.col { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; display: flex; flex-direction: column; min-width: 0; }
.col.bteam { background: var(--bteam); }
.col-head { padding: 12px 12px 10px; border-bottom: 2px solid var(--accent); display: grid; gap: 4px; }
.col.bteam .col-head { border-bottom-color: var(--rule); }
.col-title { display: flex; gap: 8px; align-items: center; }
.col-title input { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 1.15rem; color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 2px 4px; margin-left: -5px; }
.col-title input:hover { border-color: var(--rule); }
.col-title .static { flex: 1; font-family: var(--display); font-weight: 700; font-size: 1.15rem; }
.count { font-size: .72rem; font-weight: 600; letter-spacing: .06em; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.note { font-family: var(--label); font-size: .82rem; color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 3px; padding: 2px 4px; margin-left: -5px; width: 100%; }
.note:hover { border-color: var(--rule); }
ol.list { list-style: none; margin: 0; padding: 8px; display: grid; gap: 6px; min-height: 64px; }
.empty-hint { font-size: .8rem; color: var(--muted); font-style: italic; padding: 10px 6px; text-align: center; }
li.ep { background: var(--card); border: 1px solid var(--rule); border-radius: 4px; padding: 7px 8px 7px 4px; display: grid; grid-template-columns: auto auto 1fr auto; gap: 2px 8px; align-items: start; }
.col.bteam li.ep { grid-template-columns: auto 1fr auto; }
li.ep.ghost { opacity: .35; }
li.ep.chosen { box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.grip { cursor: grab; color: var(--muted); padding: 2px 4px; font-size: 1rem; line-height: 1.3; user-select: none; touch-action: none; }
.num { font-family: var(--display); font-weight: 700; color: var(--accent); min-width: 1.6em; text-align: right; line-height: 1.5; font-variant-numeric: tabular-nums; }
.body { min-width: 0; }
.t { font-family: var(--display); font-weight: 700; font-size: .98rem; line-height: 1.35; overflow-wrap: anywhere; }
.g { font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
.lg { font-size: .84rem; line-height: 1.4; color: var(--ink); opacity: .85; margin-top: 4px; }
body:not(.show-loglines) .lg { display: none; }
.more { font-size: 1rem; padding: 2px 6px; }
.actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 4px 2px 4px; border-top: 1px dashed var(--rule); margin-top: 6px; }
.actions button { font-size: .7rem; padding: 6px 8px; }
.edit { grid-column: 1 / -1; display: grid; gap: 6px; padding: 8px 4px 2px; border-top: 1px dashed var(--rule); margin-top: 6px; }
.edit input, .edit textarea, .add input, .snapform textarea { font: inherit; font-size: .88rem; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 3px; padding: 6px 8px; width: 100%; }
.edit textarea, .snapform textarea { min-height: 3.6em; resize: vertical; }
.row { display: flex; gap: 6px; flex-wrap: wrap; }
.add { padding: 0 8px 10px; display: grid; gap: 6px; }
section.snaps { background: var(--card); border: 1px solid var(--rule); border-radius: 6px; padding: 14px; display: grid; gap: 12px; }
section.snaps h2 { margin: 0; font-family: var(--display); font-size: 1.15rem; }
.snaps-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.snapform { display: grid; gap: 8px; max-width: 640px; }
.snapform[hidden] { display: none; }
ul.snaplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
li.snap { border: 1px solid var(--rule); border-radius: 4px; padding: 10px 12px; display: grid; gap: 6px; }
.snap-top { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.snap-date { font-family: var(--display); font-weight: 700; }
.snap-sum { font-size: .76rem; color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.snap-note { font-size: .9rem; line-height: 1.45; white-space: pre-wrap; max-width: 75ch; }
.snap-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding-top: 6px; border-top: 1px dashed var(--rule); }
.snap-view h3 { margin: 0 0 4px; font-family: var(--display); font-size: .92rem; }
.snap-view ol { margin: 0; padding-left: 1.6em; font-size: .85rem; line-height: 1.45; }
.snap-view ul { margin: 0; padding-left: 1.1em; font-size: .85rem; line-height: 1.45; }
.status { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 6px; font-size: .86rem; display: flex; gap: 12px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100vw - 32px); }
.status[hidden] { display: none; }
.status button { background: transparent; color: var(--paper); border-color: currentColor; }
.hidden-file { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<!-- Plausible Analytics -->
<script async src="https://plausible.io/js/pa-l22G6JEP7wvc_HwvZWRQ-.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>The Other City<small>Season board</small></h1>
    <div class="toolbar">
      <button id="undoBtn" type="button" title="Undo (Cmd/Ctrl+Z)">Undo</button>
      <button id="redoBtn" type="button" title="Redo (Shift+Cmd/Ctrl+Z)">Redo</button>
      <span class="sep"></span>
      <button id="newSeasonBtn" type="button">+ New season</button>
      <button id="snapBtn" type="button" class="primary">Save snapshot</button>
      <span class="sep"></span>
      <button id="copyBtn" type="button">Copy list</button>
      <button id="exportBtn" type="button">Export</button>
      <label class="btn" for="importFile">Import</label>
      <input id="importFile" class="hidden-file" type="file" accept="application/json,.json">
      <span class="sep"></span>
      <label class="toggle"><input id="loglineToggle" type="checkbox"> Show loglines</label>
    </div>
  </header>

  <div class="board" id="board"></div>

  <section class="snaps" aria-labelledby="snapsTitle">
    <div class="snaps-head">
      <h2 id="snapsTitle">Snapshots</h2>
      <span class="snap-sum" id="snapCount"></span>
    </div>
    <form class="snapform" id="snapForm" hidden>
      <label for="snapNote" class="g">What's the logic of this build?</label>
      <textarea id="snapNote" placeholder="e.g. Chorus of Demons moved to 7 so the darkest episode sits just past the middle."></textarea>
      <div class="row">
        <button type="submit" class="primary">Save snapshot</button>
        <button type="button" id="snapCancel">Cancel</button>
      </div>
    </form>
    <ul class="snaplist" id="snapList"></ul>
  </section>
</div>

<div class="status" id="status" role="status" hidden><span id="statusText"></span><button type="button" id="statusUndo" hidden>Undo</button></div>

<script>
(function () {
  var KEY = "toc-season-board-v1";
  var PREF = "toc-season-board-prefs";

  function seed() {
    var eps = {};
    var order = [];
    function add(id, title, genre, logline) { eps[id] = { title: title, genre: genre || "", logline: logline || "" }; order.push(id); return id; }
    var s1 = [
      add("my-old-man", "My Old Man", "Dark comedy", ""),
      add("my-best-fiend", "My Best Fiend", "Psychological horror", "A successful young woman is terrorized by the imaginary friend of her childhood, who has come to take what's owed her."),
      add("one-way-ticket", "One Way Ticket", "Existential fantasy", "A man bent on suicide boards a train, which turns out to be headed to the Underworld. If he decides to live, though, will he be able to get back?"),
      add("son-of-poseidon", "Son of Poseidon", "Drama / fairy tale", "A teenage girl falls in love with a mysterious young man who's visiting Brighton Beach for the summer. Her mother is worried and ultimately is right to be: the young man is the son of Poseidon."),
      add("we-love-me", "We Love Me", "Fantastical comedy", "An \"energy vampire\" spinning instructor falls for a normie. But in order to be in the relationship, she will have to give up her immortality, and the relentless attention that feeds it."),
      add("the-coming", "The Coming", "Drama", "A Hasidic girl is identified by a radical young rabbi as potentially being the Tzadik ha'Dor, the one their people have been awaiting for thousands of years. Her father wants her free of this cult; her mother can't stand the thought of her leaving the faith."),
      add("chorus-of-demons", "A Chorus of Demons", "Existential horror", "One day, the city itself becomes a malevolent entity pursuing Adam Miller. All eyes, all windows and cars and walls and signage are a part of the evil will. A mental patient finally finds him and tells him he's suffering adverse drug effects, and there is a way out. Will he take it?"),
      add("four-dimensional-chess", "Four-Dimensional Chess", "Sci-fi thriller", "In the latest game of wizard's chess that determines the fate of the world, Willie is committed to seeing his grandson's death from leukemia undone. But his eternal adversary, Bruno, has ensured that this move would exact an unbearable cost."),
      add("paper-cranes", "Paper Cranes Are Flying", "Drama / romance", "A Chinese restaurant owner is shocked when he receives an order for potstickers, clearly written in the handwriting of the woman who left him waiting at the airport thirty years before. Why is she back now?"),
      add("sleeping", "Sleeping, She Dreams of Us", "Supernatural thriller", "Distraught and heartbroken that his wife is in a deep coma after a car accident, a man goes to a nearby bar, where he strikes up a conversation with Veronica. Who turns out to be a character from his wife's long-abandoned novel. They are both part of his sleeping wife's dream.")
    ];
    var b = [
      add("childs-play", "Child's Play", "Action / comedy", "A little boy successfully uses ancient Aztec magic to get back at his bullies."),
      add("tree-grows", "A Tree Grows in Brooklyn", "Romantic comedy", "A woman is exasperated with what she believes is a feature of her husband's incipient mental illness: he talks to plants. Until one day, he manages to find their runaway daughter by communicating with the trees in the park."),
      add("drop-of-poison", "A Drop of Poison", "Horror", "An insecure young writer takes a date to an avant-garde downtown play and whispers to her derisively about it. But when she tells him to \"Shut up, Michael!\" the world has subtly shifted. And now he finds himself in 1972, where the play is the hottest thing going and he is the fish out of water."),
      add("dr-schloss", "Waiting for Dr. Schloss", "Existential comedy / horror", "A woman waits and waits in a doctor's office until she eventually emerges into a no-man's-land and must find her way back. If there is one."),
      add("strange-currencies", "Strange Currencies", "Drama with comedic elements", "Piano tuner / composer."),
      add("what-is-real", "What Is Real Is Real", "Sci-fi horror", "Man escapes into the internet and finds he can be anywhere, be anyone, do anything. And that this is a terrible cage."),
      add("throw-away-the-key", "Throw Away the Key", "Existential horror", "A young woman is drawn into a Kafkaesque nightmare when she uses a forbidden word at work."),
      add("twos-a-crowd", "Two's a Crowd", "Horror", "Repaying his real kindness, an old flame gets revenge on a man's boss by marshaling her family of small creatures to devour him."),
      add("blind-date", "Blind Date", "Comedy", "A young man goes on a blind date with a girl who becomes possessed by the spirit of his grandfather, who gives him romantic advice."),
      add("are-you-x", "\"Are You X By Any Chance?\"", "Social thriller", "A lost young woman, newly moved to NYC, joins a religious cult in order to belong. But finds it takes her even further away from herself."),
      add("politics-as-usual", "Politics as Usual", "Yokai ghost story", "A young politician must negotiate with the ghost of the man who held the seat she is trying to fill."),
      add("are-you-it", "Are You It?", "Magical realist comedy / drama", "A husband and wife wrestle with the discovery that she is and always has been a frog.")
    ];
    return {
      version: 1,
      episodes: eps,
      seasons: [{ id: "s1", name: "Season 1", note: "Opens with the ham radio broadcast.", eps: s1 }],
      bteam: b,
      snapshots: []
    };
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function valid(s) {
    return s && typeof s === "object" && s.episodes && Array.isArray(s.seasons) && Array.isArray(s.bteam) &&
      s.seasons.every(function (x) { return x && typeof x.id === "string" && Array.isArray(x.eps); });
  }

  var state;
  try { state = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { state = null; }
  if (!valid(state)) state = seed();
  if (!Array.isArray(state.snapshots)) state.snapshots = [];

  var prefs = {};
  try { prefs = JSON.parse(localStorage.getItem(PREF) || "{}") || {}; } catch (e) { prefs = {}; }

  var undoStack = [], redoStack = [];
  var openActions = null, editing = null, viewing = {};

  function persist() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function savePrefs() { try { localStorage.setItem(PREF, JSON.stringify(prefs)); } catch (e) {} }

  function commit(mutate, msg, offerUndo) {
    undoStack.push(clone(state));
    if (undoStack.length > 150) undoStack.shift();
    redoStack = [];
    mutate(state);
    persist(); render();
    if (msg) flash(msg, offerUndo);
  }
  function undo() {
    if (!undoStack.length) return;
    redoStack.push(clone(state)); state = undoStack.pop();
    persist(); render(); flash("Undone");
  }
  function redo() {
    if (!redoStack.length) return;
    undoStack.push(clone(state)); state = redoStack.pop();
    persist(); render(); flash("Redone");
  }

  var statusEl = document.getElementById("status"), statusText = document.getElementById("statusText"), statusUndo = document.getElementById("statusUndo"), st;
  function flash(msg, offerUndo) {
    statusText.textContent = msg; statusUndo.hidden = !offerUndo; statusEl.hidden = false;
    clearTimeout(st); st = setTimeout(function () { statusEl.hidden = true; }, offerUndo ? 6000 : 2200);
  }
  statusUndo.addEventListener("click", function () { statusEl.hidden = true; undo(); });

  function listName(key) {
    if (key === "bteam") return "B team";
    var s = state.seasons.filter(function (x) { return x.id === key; })[0];
    return s ? (s.name || "Untitled season") : "";
  }
  function arrFor(st0, key) {
    if (key === "bteam") return st0.bteam;
    var s = st0.seasons.filter(function (x) { return x.id === key; })[0];
    return s ? s.eps : null;
  }
  function whereIs(id) {
    if (state.bteam.indexOf(id) > -1) return "bteam";
    for (var i = 0; i < state.seasons.length; i++) if (state.seasons[i].eps.indexOf(id) > -1) return state.seasons[i].id;
    return null;
  }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  var board = document.getElementById("board");
  var sortables = [];

  function render() {
    sortables.forEach(function (s) { s.destroy(); }); sortables = [];
    board.innerHTML = "";
    state.seasons.forEach(function (s) { board.appendChild(column(s.id, s)); });
    board.appendChild(column("bteam", null));
    document.querySelectorAll("ol.list").forEach(function (ol) {
      sortables.push(Sortable.create(ol, {
        group: "eps", handle: ".grip", animation: 150, ghostClass: "ghost", chosenClass: "chosen",
        filter: ".empty-hint",
        onStart: function () { pre = clone(state); },
        onEnd: function () { applyDomOrder(); }
      }));
    });
    document.getElementById("undoBtn").disabled = !undoStack.length;
    document.getElementById("redoBtn").disabled = !redoStack.length;
    renderSnaps();
  }
  var pre = null;
  function applyDomOrder() {
    var next = clone(state);
    document.querySelectorAll("ol.list").forEach(function (ol) {

<script data-engagement-beacon="7">
// Blocker-proof engagement beacon — see ~/Scripts/inject_beacon.py
(function(){
  var BEACON = 'https://media.thomaswoodrow.com/_e';
  // The page's own tracking is left alone. These say which Plausible events it
  // does NOT already fire, so the shim fills the gaps without double-counting.
  var P_PLAY = true, P_MILESTONES = true, P_CARDS = true;
  var sent = {};
  // Plausible milestones keep their own dedupe: the server records every 10%,
  // but the dashboard still gets 25/50/75 so its existing goals and history
  // stay comparable. Two ladders, one pass.
  var sentP = {};

  function plaus(name, props){
    if (typeof window.plausible === 'function') window.plausible(name, { props: props || {} });
  }

  function slug(){
    var parts = location.pathname.split('/').filter(Boolean);

  // The code rides on the URL, but only on the page that was actually linked.
  // Click deeper into the same site and it's gone from location.search — so
  // fall back to the referring page, which still carries it.
  function refCode(){
    var here = new URLSearchParams(location.search).get('ref');
    if (here) return here;
    try {

      if (r.origin !== location.origin) return null;   // only trust our own pages
      return r.searchParams.get('ref');

  }

  // clicks (each distinct link is its own event).

    });

    });
  }, true);

    if (!isMedia(e.target)) return;

    send('complete', 100);

  // covers the viewport midline. Reports the furthest card reached, and which
  // card is under the midline right now, for the per-card clock below.

  // alone, which is deck-template's shape — the DEPLOYED decks nest a card div
  // inside a slide section instead, so the selector matched nothing and every
  // deck recorded zero progress while looking like it worked. (Written without
  // the literal markup: greps counting slides on a page must not match the
  // tracker that counts them.)

  })();

  // ---- outbound clicks: what they clicked --------------------------------
  // Delegated capture-phase listener on links leaving this page. The event
  // string carries a short host+path label so the sheet shows WHICH link was
  // followed. In-page anchors, mailto/tel and non-http schemes are ignored.
  document.addEventListener('click', function(e){
    try {
      var a = e.target && e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var raw = a.getAttribute('href') || '';
      if (/^(#|javascript:|mailto:|tel:|sms:)/i.test(raw)) return;
      var u; try { u = new URL(a.href, location.href); } catch (_) { return; }
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return;
      var path = (u.pathname && u.pathname !== '/') ? u.pathname : '';
      var label = (u.host.replace(/^www\./, '') + path).slice(0, 24);
      sendRaw('click:' + label, 0);
    } catch (err) { /* never let tracking break a click */ }
  }, true);
})();
</script>
</body>
</html>
